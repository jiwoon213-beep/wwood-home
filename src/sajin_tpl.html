<script>
(function(){var V="/assets/vis/",M=null,W=null,Q=null,I=null,st=document.getElementById("sjst");

function load(){if(M)return Promise.resolve();say("처음 한 번만 준비해요… (약 10초)");
 return Promise.all([js(V+"tf.min.js"),fetch(V+"items.json").then(function(r){return r.json()}),bin(V+"proj.bin"),bin(V+"items.bin")]).then(function(a){I=a[1];var h=new Uint16Array(a[2]),f=new Float32Array(h.length);for(var k=0;k<h.length;k++)f[k]=h2f(h[k]);W=f;Q=new Int8Array(a[3]);return tf.loadGraphModel(V+"model/model.json")}).then(function(m){M=m})}
function emb(c){return tf.tidy(function(){return M.predict(tf.browser.fromPixels(c).toFloat().div(255).expandDims(0)).dataSync().slice(0)})}
function crop(img,z){var c=document.createElement("canvas");c.width=c.height=224;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,224,224);var s=Math.min(img.width,img.height)*z;x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,224,224);return c}
function proj(e){var D=I.dim,n=0,k,j;for(k=0;k<1280;k++)n+=e[k]*e[k];n=Math.sqrt(n)||1;var y=new Float32Array(D),m=0;for(k=0;k<1280;k++){var v=e[k]/n-W[k];for(j=0;j<D;j++)y[j]+=v*W[1280+k*D+j]}for(j=0;j<D;j++)m+=y[j]*y[j];m=Math.sqrt(m)||1;for(j=0;j<D;j++)y[j]/=m;return y}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function href(p){return p.l?p.l:p.d?"https://wwood.kr/home/"+(/Mobi|Android|iPhone|iPod|iPad/i.test(navigator.userAgent)?"mobile":"mall")+"/shoplist.php?idx="+p.d+"&pmode=view":"/jaryo/"+p.u+".html"}

function run(f){if(!f)return;var u=URL.createObjectURL(f);document.getElementById("sjpv").innerHTML='<img src="'+u+'" alt="찍은 사진">';
 load().then(function(){say("비슷한 제품 찾는 중…");var im=new Image();im.onload=function(){setTimeout(function(){
  var ys=[proj(emb(crop(im,1))),proj(emb(crop(im,.7))),proj(emb(crop(im,.45)))],D=I.dim,N=Q.length/D,S=new Float32Array(N),i,j,t;
  for(i=0;i<N;i++){var b=0;for(t=0;t<3;t++){var s=0,o=i*D,y=ys[t];for(j=0;j<D;j++)s+=y[j]*Q[o+j];if(s>b)b=s}S[i]=b}
  var ix=[];for(i=0;i<N;i++)ix.push(i);ix.sort(function(a,b){return S[b]-S[a]});var seen={},out=[];
  for(i=0;i<ix.length&&out.length<24;i++){var p=I.d[ix[i]],k=p.n;if(seen[k])continue;seen[k]=1;out.push(p)}
  document.getElementById("sjr").innerHTML=out.map(function(p,n){var l=href(p),ext=!p.l;return'<a class="pd'+(n?"":" top")+'" href="'+esc(l)+'"'+(ext?' target="_blank" rel="noopener"':"")+'><span class="pi"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(img(p))+'" alt="'+esc(p.n)+'"></span><span><b>'+(n?"":"가장 비슷한 제품 · ")+esc(p.n)+'</b><small>'+esc(p.s||p.c||"")+'</small></span></a>'}).join("");
  document.getElementById("sjh").style.display="";document.getElementById("sjnote").style.display="";say("");document.getElementById("sjh").scrollIntoView({behavior:"smooth"});
 },30)};im.src=u}).catch(function(){say("준비 중이에요. 잠시 뒤 다시 해 주세요.")})}
