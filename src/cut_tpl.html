<section class="wrap sec cutp">
<h1>합판·MDF 재단 미리보기</h1>
<p class="lead">자재 고르고, 필요한 크기만 넣으세요. 원판에서 <b>어떻게 잘리는지</b> 그림으로 바로 보여드립니다. 이 화면을 매장에 보여주시면 그대로 잘라 드려요.</p>

<div class="cutgrid"><div class="cutbox">
 <div class="cstep"><span class="cn">1</span>자재</div>
 <div class="ctabs" id="ctabs"></div>
 <select id="cprod" class="cin"></select>
 <div id="ccustom" class="crow" style="display:none">
  <label>원판 가로<input class="cin" id="cw" type="number" inputmode="numeric" value="1220"></label>
  <label>원판 세로<input class="cin" id="ch" type="number" inputmode="numeric" value="2440"></label>
 </div>
 <div class="cpic" id="cpic"></div>
 <div class="cinfo" id="cinfo"></div>

 <div class="cstep"><span class="cn">2</span>자를 크기 <small id="cunit">(mm)</small></div>
 <div id="cparts"></div>
 <button class="b o cadd" id="cadd" type="button">+ 크기 추가</button>
 <label class="cchk" id="cgrainw"><input type="checkbox" id="cgrain"> 나뭇결 방향 유지 (조각 안 돌리기)</label>
</div>

<div class="cout"><div class="cres" id="cres"></div>
<div id="csvg"></div>

<div class="cact">
 <button class="b r" id="cshare" type="button">링크 복사</button>
 <button class="b o" id="cprint" type="button">인쇄</button>
 <a class="b d" href="tel:__TEL__">전화 문의</a>
</div></div></div>
<p class="small muted">톱날 두께 3mm를 빼고 계산합니다. 실제 재단은 자재 상태(휨·모서리)에 따라 조금 달라질 수 있어요. 원판·각재 규격은 매장 취급 제품 기준입니다.</p>
</section>
<style>
.cutp h1{margin-bottom:6px}.cutbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.cstep{font-weight:800;font-size:18px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}.cstep:first-child{margin-top:0}.cstep small{font-weight:500;color:var(--mut);font-size:14px}

.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.ctabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer}.ctabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cin{width:100%;font-size:16px;padding:10px;border:1px solid #cfc7ba;border-radius:8px;background:#fff;box-sizing:border-box}

.cpic{display:none;margin-top:10px;gap:12px;align-items:center;background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:8px}.cpic img{width:120px;height:120px;object-fit:cover;border-radius:8px;background:#eee;flex:0 0 auto;cursor:zoom-in}.cpic b{display:block;font-size:16px;margin-bottom:4px}.cpic a{font-size:14px}
.cinfo{font-size:14px;color:var(--mut);margin-top:6px}

.cutgrid{display:block}@media(min-width:960px){.cutgrid{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}.cutgrid .cutbox{position:sticky;top:12px;margin:0}.cout{min-width:0}}
.cres{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.cres div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:120px}.cres b{display:block;font-size:24px}.cres small{color:var(--mut)}
.cres .cerr{background:#fff3f2;border-color:#f3c2bd;color:var(--red);flex-basis:100%}

.csheet svg{width:100%;height:auto;display:block}

<script>
(function(){
var D=__DATA__,KERF=3,COL=["#f6c89f","#a8d5ba","#a9c8ec","#f2a7a7","#d6c1ea","#f3e19b","#9fd9d9","#e8b9d6","#c9d99f","#f0c0a0"];
var $=function(i){return document.getElementById(i)};
var cat=0,prod=0,parts=[];
function curCat(){return D.cats[cat]}
function isLin(){return curCat().lin}
function custom(){return curCat().custom}
function stock(){
 if(custom()){return isLin()?{L:+$("cw").value||3600}:{w:+$("cw").value||1220,h:+$("ch").value||2440}}
 var p=curCat().items[prod];return isLin()?{L:p[1]}:{w:p[1],h:p[2]};
}
function tabs(){
 $("ctabs").innerHTML=D.cats.map(function(c,i){return '<button type="button" data-i="'+i+'"'+(i==cat?' class="on"':'')+'>'+c.n+'</button>'}).join("");
 [].forEach.call($("ctabs").children,function(b){b.onclick=function(){setCat(+b.dataset.i,true)}});
}
function setCat(i,reset){
 cat=i;prod=0;tabs();var c=curCat();
 $("cprod").style.display=c.custom?"none":"";$("ccustom").style.display=c.custom?"":"none";
 $("cprod").innerHTML=(c.items||[]).map(function(p,k){return '<option value="'+k+'">'+p[0]+'</option>'}).join("");
 $("cgrainw").style.display=c.lin?"none":"";
 $("cunit").textContent=c.lin?"(길이 mm)":"(가로 × 세로 mm)";
 if(c.custom){$("ccustom").querySelector("label").firstChild.textContent=c.lin?"원래 길이":"원판 가로";$("ch").parentNode.style.display=c.lin?"none":"";if(reset){$("cw").value=c.lin?3600:1220;$("ch").value=2440}}
 if(reset)parts=c.lin?[[900,0,4]]:[[600,400,2]];
 drawParts();run();
}
function drawParts(){
 var L=isLin();
 $("cparts").innerHTML=parts.map(function(p,k){
  return '<div class="cpart'+(L?' l':'')+'"><input class="cin" type="number" inputmode="numeric" data-k="'+k+'" data-f="0" value="'+(p[0]||"")+'" placeholder="'+(L?"길이":"가로")+'">'+
  (L?'':'<span>×</span><input class="cin" type="number" inputmode="numeric" data-k="'+k+'" data-f="1" value="'+(p[1]||"")+'" placeholder="세로">')+
  '<span>×</span><input class="cin" type="number" inputmode="numeric" data-k="'+k+'" data-f="2" value="'+(p[2]||1)+'" placeholder="개"><button type="button" class="cdel" data-k="'+k+'" aria-label="삭제">×</button></div>'}).join("");
 [].forEach.call($("cparts").querySelectorAll("input"),function(x){x.oninput=function(){parts[+x.dataset.k][+x.dataset.f]=+x.value||0;run()}});
 [].forEach.call($("cparts").querySelectorAll(".cdel"),function(x){x.onclick=function(){parts.splice(+x.dataset.k,1);if(!parts.length)parts=[[0,0,1]];drawParts();run()}});
}
/* 판재: 길로틴(직선 재단) 방식 — 패널쏘로 그대로 자를 수 있는 배치 */
function packSheets(W,H,list,rot){
 var bins=[],err=[];
 list.sort(function(a,b){return Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h});
 list.forEach(function(p){
  var fitsN=p.w<=W&&p.h<=H,fitsR=rot&&p.h<=W&&p.w<=H;
  if(!fitsN&&!fitsR){err.push(p);return}
  var best=null;
  bins.forEach(function(b,bi){b.free.forEach(function(f,fi){
   [[p.w,p.h,0],[p.h,p.w,1]].forEach(function(o){
    if(o[2]&&!rot)return;
    if(o[0]<=f.w&&o[1]<=f.h){var s=Math.min(f.w-o[0],f.h-o[1]);if(!best||s<best.s)best={s:s,bi:bi,fi:fi,w:o[0],h:o[1]}}
   })})});
  if(!best){var o=fitsN?[p.w,p.h]:[p.h,p.w];bins.push({free:[{x:0,y:0,w:W,h:H}],pl:[]});best={bi:bins.length-1,fi:0,w:o[0],h:o[1]}}
  var b=bins[best.bi],f=b.free[best.fi];b.free.splice(best.fi,1);
  b.pl.push({x:f.x,y:f.y,w:best.w,h:best.h,c:p.c});
  var rw=f.w-best.w-KERF,rh=f.h-best.h-KERF;
  // 남는 쪽을 크게 남기도록 자르는 방향 결정
  if(rw*f.h>=rh*f.w){ if(rw>0)b.free.push({x:f.x+best.w+KERF,y:f.y,w:rw,h:f.h}); if(rh>0)b.free.push({x:f.x,y:f.y+best.h+KERF,w:best.w,h:rh}); }
  else { if(rh>0)b.free.push({x:f.x,y:f.y+best.h+KERF,w:f.w,h:rh}); if(rw>0)b.free.push({x:f.x+best.w+KERF,y:f.y,w:rw,h:best.h}); }
 });
 return {bins:bins,err:err};
}
function packLin(L,list){
 var bins=[],err=[];list.sort(function(a,b){return b.l-a.l});
 list.forEach(function(p){
  if(p.l>L){err.push(p);return}
  var b=null;for(var i=0;i<bins.length;i++){if(bins[i].used+p.l+(bins[i].pl.length?KERF:0)<=L){b=bins[i];break}}
  if(!b){b={used:0,pl:[]};bins.push(b)}
  if(b.pl.length)b.used+=KERF;b.pl.push({x:b.used,l:p.l,c:p.c});b.used+=p.l;
 });
 return {bins:bins,err:err};
}
/* 자재 표면 질감 — 실제 자재처럼 보이게 */
function mat(){
 var c=curCat().n,n=custom()?"":(curCat().items[prod]||[""])[0];
 if(/핑크/.test(n))return{b:"#f4a9bb",g:"#d9819a",f:"0.03 0.03",a:.35};
 if(/스티로폴|이보드/.test(n))return{b:"#f6f5f0",g:"#cfcdc4",f:"0.09 0.09",a:.5};
 if(c=="단열재")return{b:"#f2efe6",g:"#c9c4b5",f:"0.05 0.05",a:.4};
 if(c=="석고보드")return{b:"#e8e6df",g:"#bdb9ae",f:"0.02 0.02",a:.25};
 if(/OSB/i.test(n))return{b:"#c9995a",g:"#6e461d",f:"0.011 0.016",a:1.1,osb:1};
 if(/코팅|태고/.test(n))return{b:"#4a3528",g:"#2a1d15",f:"0.002 0.03",a:.35};
 if(/자작/.test(n))return{b:"#ecd6ad",g:"#b48d5c",f:"0.0015 0.04",a:.6};
 if(c=="MDF")return /백색|LPM/.test(n)?{b:"#f7f6f2",g:"#dcd9d0",f:"0.05 0.05",a:.25}:{b:"#b88c5d",g:"#7c5634",f:"0.06 0.06",a:.45};
 if(c=="집성판")return /멀바우|참죽/.test(n)?{b:"#9a5a33",g:"#5c3019",f:"0.0015 0.05",a:.8,st:1}:/히노끼|삼목|레드파인/.test(n)?{b:"#e8c896",g:"#b07d47",f:"0.0015 0.05",a:.7,st:1}:{b:"#d9ad74",g:"#8f5f2c",f:"0.0015 0.05",a:.8,st:1};
 if(c=="방부목")return{b:"#ab9a63",g:"#66603a",f:"0.0012 0.08",a:.8};
 if(c=="데크")return /합성/.test(n)?{b:"#6e4c35",g:"#3e2919",f:"0.001 0.2",a:.6,gr:1}:{b:"#b8875a",g:"#6e4626",f:"0.0012 0.08",a:.8};
 if(c=="합판")return{b:"#dcb987",g:"#8d6236",f:"0.0016 0.035",a:.75};
 return{b:"#e0be8c",g:"#8f6538",f:"0.0012 0.07",a:.8};
}
var SID=0;
function tex(W,H,m){
 var id="t"+(++SID),k=m.a,s='<defs><filter id="'+id+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="'+m.f+'" numOctaves="'+(m.osb?2:4)+'" seed="'+(SID*7%50)+'"/><feColorMatrix type="matrix" values="0 0 0 0 '+hex(m.g,0)+' 0 0 0 0 '+hex(m.g,1)+' 0 0 0 0 '+hex(m.g,2)+' '+(m.osb?2.6:1.4)*k+' 0 0 0 '+(m.osb?-1.1:-0.45)*k+'"/></filter></defs>';
 s+='<rect width="'+W+'" height="'+H+'" fill="'+m.b+'"/><rect width="'+W+'" height="'+H+'" filter="url(#'+id+')"/>';
 if(m.st){for(var y=0,i=0;y<H;i++){var h=45+(i*37%30);s+='<rect y="'+y+'" width="'+W+'" height="'+h+'" fill="'+(i%2?"#fff":"#000")+'" opacity="'+(0.04+(i*13%5)/100)+'"/><line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>';y+=h}}
 if(m.gr){for(var y=8;y<H;y+=H/8)s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#000" stroke-opacity=".35" stroke-width="2"/>'}
 return s;
}
function hex(c,i){return (parseInt(c.substr(1+i*2,2),16)/255).toFixed(3)}
var FS='font-family="Pretendard,Noto Sans KR,sans-serif"';
function dims(W,H,ox,oy,showH){
 var f=showH?Math.max(34,Math.min(W,H)/17):W/38,s='<g stroke="#8a8174" stroke-width="2" fill="#5e574e" '+FS+'>';
 var y=-oy*0.55;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><line x1="0" x2="0" y1="'+(y-12)+'" y2="'+(y+12)+'"/><line x1="'+W+'" x2="'+W+'" y1="'+(y-12)+'" y2="'+(y+12)+'"/>';
 s+='<rect x="'+(W/2-f*2.6)+'" y="'+(y-f*0.7)+'" width="'+f*5.2+'" height="'+f*1.4+'" fill="#f6f3ee" stroke="none"/><text x="'+W/2+'" y="'+y+'" font-size="'+f+'" text-anchor="middle" dominant-baseline="central" stroke="none" font-weight="700">'+W+' mm</text>';
 if(showH){var x=-ox*0.55;s+='<line y1="0" y2="'+H+'" x1="'+x+'" x2="'+x+'"/><line y1="0" y2="0" x1="'+(x-12)+'" x2="'+(x+12)+'"/><line y1="'+H+'" y2="'+H+'" x1="'+(x-12)+'" x2="'+(x+12)+'"/>';
  s+='<g transform="translate('+x+' '+H/2+') rotate(-90)"><rect x="'+(-f*2.6)+'" y="'+(-f*0.7)+'" width="'+f*5.2+'" height="'+f*1.4+'" fill="#f6f3ee" stroke="none"/><text font-size="'+f+'" text-anchor="middle" dominant-baseline="central" stroke="none" font-weight="700">'+H+' mm</text></g>'}
 return s+'</g>';
}
function board(W,H,m,R,free,showH){
 var k=++SID,ox=showH?Math.max(90,H/9):10,oy=Math.max(80,(showH?H:W/6)/9),th=Math.max(10,Math.min(W,H)/70);
 var s='<svg viewBox="'+(-ox)+' '+(-oy)+' '+(W+ox+20)+' '+(H+oy+th+24)+'" xmlns="http://www.w3.org/2000/svg">';
 s+='<defs><g id="tx'+k+'">'+tex(W,H,m)+'</g><clipPath id="cp'+k+'">'+R.map(function(r){return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" rx="2"/>'}).join('')+'</clipPath>'+
  '<filter id="sh'+k+'" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="'+th*0.6+'" stdDeviation="'+th*0.6+'" flood-color="#3a2a18" flood-opacity=".35"/></filter>'+
  '<linearGradient id="gl'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient></defs>';
 // 원판 두께(옆면)
 s+='<rect x="0" y="'+th+'" width="'+W+'" height="'+H+'" rx="4" fill="'+m.g+'" opacity=".55"/>';
 // 자투리: 연하게 비친 원판
 s+='<use href="#tx'+k+'"/><rect width="'+W+'" height="'+H+'" fill="#f6f3ee" opacity=".62"/><rect width="'+W+'" height="'+H+'" fill="none" stroke="#b9ae9c" stroke-width="3" rx="4"/>';
 free.forEach(function(f){var t=showH?'자투리 '+f[2]+'×'+f[3]:'남는 '+f[2],fs=Math.min(showH?Math.min(W,H)/24:H*0.3,f[2]/(t.length*0.62),f[3]*0.3);if(fs>14)s+='<rect x="'+(f[0]+6)+'" y="'+(f[1]+6)+'" width="'+(f[2]-12)+'" height="'+(f[3]-12)+'" fill="none" stroke="#a69a86" stroke-width="2.5" stroke-dasharray="14 10" rx="6"/><text x="'+(f[0]+f[2]/2)+'" y="'+(f[1]+f[3]/2)+'" font-size="'+fs+'" text-anchor="middle" dominant-baseline="central" fill="#8a7f6d" '+FS+'>'+t+'</text>'});
 // 조각: 실제 자재 + 그림자
 s+='<g filter="url(#sh'+k+')"><g clip-path="url(#cp'+k+')"><use href="#tx'+k+'"/><rect width="'+W+'" height="'+H+'" fill="url(#gl'+k+')"/></g></g>';
 R.forEach(function(r){
  s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" rx="2" fill="none" stroke="rgba(30,20,10,.55)" stroke-width="2.5"/><rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+Math.max(4,th*0.5)+'" fill="'+COL[r[5]%COL.length]+'"/>';
  var t=r[4],fs=Math.min(showH?Math.min(W,H)/16:H*0.42,r[2]/(t.length*0.66),r[3]*(showH?0.34:0.42));
  if(fs>11){var pw=fs*t.length*0.6+fs*1.2,ph=fs*1.6;s+='<rect x="'+(r[0]+r[2]/2-pw/2)+'" y="'+(r[1]+r[3]/2-ph/2)+'" width="'+pw+'" height="'+ph+'" rx="'+ph/2+'" fill="#fff" opacity=".92"/><text x="'+(r[0]+r[2]/2)+'" y="'+(r[1]+r[3]/2)+'" font-size="'+fs+'" text-anchor="middle" dominant-baseline="central" font-weight="800" fill="#1d1b18" '+FS+'>'+t+'</text>'}
 });
 return s+dims(W,H,ox,oy,showH)+'</svg>';
}
function svgSheet(W,H,b){
 var land=W<H,VW=land?H:W,VH=land?W:H,m=mat(),R=[],F=[];
 b.pl.forEach(function(p){var x=land?p.y:p.x,y=land?p.x:p.y,w=land?p.h:p.w,h=land?p.w:p.h;R.push([x,y,w,h,w+'×'+h,p.c])});
 b.free.slice().sort(function(a,c){return c.w*c.h-a.w*a.h}).slice(0,2).forEach(function(f){if(f.w>=150&&f.h>=150)F.push(land?[f.y,f.x,f.h,f.w]:[f.x,f.y,f.w,f.h])});
 return board(VW,VH,m,R,F,1)+'<div class="cleg"><span><i style="background:#d9b98a"></i>자르는 조각</span><span><i style="background:#e9e3d8;border:1px dashed #a69a86"></i>남는 자투리</span><span>톱날 3mm 반영</span></div>';
}
function svgLin(L,b){
 var H=Math.max(160,L/9),m=mat(),R=b.pl.map(function(p){return[p.x,0,p.l,H,p.l+'',p.c]}),rest=L-b.used,F=rest>=150?[[b.used+KERF,0,rest-KERF,H]]:[];
 return board(L,H,m,R,F,0);
}
function run(){
 var st=stock(),L=isLin(),list=[],n=0;
 $("cinfo").textContent=L?('원래 길이 '+st.L+'mm'):('원판 '+st.w+' × '+st.h+'mm');
 var it=custom()?null:curCat().items[prod],pic=it&&it[L?2:3],cp=$("cpic");
 if(pic){cp.style.display="flex";cp.innerHTML='<img src="'+pic[0]+'" alt="'+pic[1]+'" loading="lazy" onclick="window.open(this.src)"><div><b>'+pic[1]+'</b><span class="small muted">매장 실제 제품 사진</span><br><a href="/jaryo/?q='+encodeURIComponent(pic[1])+'">사진 더 보기 ›</a></div>'}else{cp.style.display="none";cp.innerHTML=""}
 parts.forEach(function(p,k){var q=Math.min(+p[2]||0,500);for(var i=0;i<q;i++){if(L){if(p[0]>0)list.push({l:+p[0],c:k})}else if(p[0]>0&&p[1]>0)list.push({w:+p[0],h:+p[1],c:k})}});
 n=list.length;var r=L?packLin(st.L,list):packSheets(st.w,st.h,list,!$("cgrain").checked),html='',sv='';
 var used=0,tot=0;
 r.bins.forEach(function(b,i){
  if(L){used+=b.pl.reduce(function(a,p){return a+p.l},0);tot+=st.L;sv+='<div class="csheet"><h3>'+(i+1)+'번째 각재<small>원래 '+st.L+'mm · 남는 길이 '+Math.max(0,st.L-b.used-KERF)+'mm</small></h3>'+svgLin(st.L,b)+'</div>'}
  else{used+=b.pl.reduce(function(a,p){return a+p.w*p.h},0);tot+=st.w*st.h;sv+='<div class="csheet"><h3>'+(i+1)+'번째 원판<small>조각 '+b.pl.length+'개</small></h3>'+svgSheet(st.w,st.h,b)+'</div>'}
 });
 if(n){html+='<div><small>필요한 '+(L?'자재':'원판')+'</small><b>'+r.bins.length+(L?'개':'장')+'</b></div><div><small>자르는 조각</small><b>'+(n-r.err.length)+'개</b></div><div><small>사용률</small><b>'+(tot?Math.round(used/tot*100):0)+'%</b></div>'}
 if(r.err.length)html+='<div class="cerr">'+(L?'원래 길이':'원판')+'보다 큰 조각 '+r.err.length+'개는 한 장에서 안 나와요. 크기를 확인해 주세요.</div>';
 if(!n)html='<div><small>크기를 넣으면 바로 그림이 나와요</small></div>';
 $("cres").innerHTML=html;$("csvg").innerHTML=sv;save();
}
function save(){
 var h='c='+cat+'&p='+prod+'&g='+($("cgrain").checked?1:0)+'&s='+parts.map(function(p){return p.join('x')}).join('_');
 if(custom())h+='&w='+$("cw").value+'&h='+$("ch").value;
 try{history.replaceState(null,'','#'+h)}catch(e){}
}
function load(){
 var q={};location.hash.slice(1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])q[a[0]]=decodeURIComponent(a[1]||'')});
 if(q.c&&D.cats[+q.c]){setCat(+q.c,true);if(q.w)$("cw").value=q.w;if(q.h)$("ch").value=q.h;if(q.p&&curCat().items&&curCat().items[+q.p]){prod=+q.p;$("cprod").value=prod}$("cgrain").checked=q.g=="1";
  if(q.s)parts=q.s.split('_').map(function(t){return t.split('x').map(Number)});drawParts();run();return true}
}
$("cprod").onchange=function(){prod=+this.value;run()};$("cw").oninput=$("ch").oninput=run;$("cgrain").onchange=run;
$("cadd").onclick=function(){parts.push(isLin()?[0,0,1]:[0,0,1]);drawParts();var x=$("cparts").lastChild.querySelector("input");x&&x.focus()};
$("cprint").onclick=function(){window.print()};
$("cshare").onclick=function(){var u=location.href,b=this;function ok(){b.textContent="복사됨 ✓";setTimeout(function(){b.textContent="링크 복사"},1500)}
 if(navigator.clipboard)navigator.clipboard.writeText(u).then(ok,function(){prompt("이 주소를 복사하세요",u)});else prompt("이 주소를 복사하세요",u)};
if(!load())setCat(0,true);
})();
</script>
