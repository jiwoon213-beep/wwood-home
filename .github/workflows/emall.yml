name: 본덱스·삼익 제품만 동기화
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: emall, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 .github/scripts/fetch_emall.py || echo "emall failed"
      - run: python3 .github/scripts/fetch_samik.py || echo "samik failed"
      - run: |
          git stash -q && git pull -q --rebase && git stash pop -q || true
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll && test -f googlebdb67d0a828cfb44.html && test -f naverba93ea476932b627cd632929e26465dd.html
          git config user.name "wwood-build-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "본덱스 제품 목록 갱신" && git pull --rebase -X theirs && git push
