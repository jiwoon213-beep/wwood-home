name: 유튜브 새 영상 자동 반영
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: rss
        run: python3 .github/scripts/yt_rss.py
      - name: build
        run: |
          ls src/data/new_videos/*.tsv >/dev/null 2>&1 || { echo "새 영상 없음"; exit 0; }
          cat src/data/new_videos/*.tsv src/data/yt_all.tsv | awk -F'\t' '!seen[$1]++' > /tmp/y && mv /tmp/y src/data/yt_all.tsv && rm -f src/data/new_videos/*.tsv
          (cd src && python3 merge_videos.py data/yt_all.tsv)
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll && test -f googlebdb67d0a828cfb44.html && test -f naverba93ea476932b627cd632929e26465dd.html
          git config user.name "wwood-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "유튜브 새 영상 자동 반영"
          git pull --rebase && git push
