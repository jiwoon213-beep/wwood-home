name: 사진으로 찾기 — 제품 사진 특징값 갱신
on:
  schedule: [{ cron: '40 13 * * *' }]   # 매일 22:40 KST (제조사 동기화 뒤)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: vis, cancel-in-progress: false }
jobs:
  vis:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy
      - run: mkdir -p /tmp/vn && cd /tmp/vn && npm init -y >/dev/null && npm i -s @tensorflow/tfjs-node@4.22.0 @tensorflow/tfjs@4.22.0 sharp@0.33.5
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/viscache
          key: vis-${{ github.run_id }}
          restore-keys: vis-
      - name: embed
        run: |
          cp .github/scripts/vis_embed.mjs /tmp/vn/
          VIS_MIN=75 node /tmp/vn/vis_embed.mjs "$PWD/assets/search.json" /tmp/viscache "$PWD/src/assets/vis/model"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/viscache
          key: vis-${{ github.run_id }}
      - name: pack & commit
        run: |
          python3 .github/scripts/vis_pack.py assets/search.json /tmp/viscache src/assets/vis
          cp /tmp/vn/node_modules/@tensorflow/tfjs/dist/tf.min.js src/assets/vis/tf.min.js
          mkdir -p assets/vis && cp -r src/assets/vis/. assets/vis/
          git config user.name "wwood-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/assets/vis assets/vis
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "사진으로 찾기: 제품 사진 특징값 갱신" && git pull --rebase -X theirs -q && git push
