name: 제조사 제품 동기화 (영림·쉐누·철물박사·본덱스·삼익)
on:
  schedule: [{ cron: '23 11 * * *' }]   # 매일 20:23 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: vendors, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: fetch
        run: |
          python3 .github/scripts/fetch_younglim.py || echo "younglim failed"
          python3 .github/scripts/fetch_shenu.py || echo "shenu failed"
          python3 .github/scripts/fetch_emall.py || echo "emall failed"
          python3 .github/scripts/fetch_samik.py || echo "samik failed"
          python3 .github/scripts/fetch_cmbs.py || echo "cmbs failed"
      - name: build if changed
        run: |
          git stash -q && git pull -q --rebase && git stash pop -q || true
          [ -z "$(git status --porcelain src/data/younglim.tsv src/data/shenu.tsv src/data/cmbs.tsv src/data/cmbs_cats.tsv src/data/cmbs_detail.tsv src/data/emall.tsv src/data/emall_cats.tsv src/data/samik.tsv)" ] && { echo "no change"; exit 0; }
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll && test -f googlebdb67d0a828cfb44.html && test -f naverba93ea476932b627cd632929e26465dd.html
          git config user.name "wwood-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "제조사(영림·쉐누·철물박사·본덱스·삼익) 제품 목록 자동 갱신" && git pull --rebase -X theirs && git push
