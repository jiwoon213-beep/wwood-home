name: 제조사 제품 동기화 (영림)
on:
  schedule: [{ cron: '23 11 * * *' }]   # 매일 20:23 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: fetch
        run: python3 .github/scripts/fetch_younglim.py
      - name: build if changed
        run: |
          [ -z "$(git status --porcelain src/data/younglim.tsv)" ] && { echo "no change"; exit 0; }
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll && test -f googlebdb67d0a828cfb44.html && test -f naverba93ea476932b627cd632929e26465dd.html
          git config user.name "wwood-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "영림 제품 목록 자동 갱신" && git pull --rebase -X theirs && git push
