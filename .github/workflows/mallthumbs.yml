name: 쇼핑몰 상품 사진 작은 사진(webp) 만들기
on:
  schedule: [{ cron: '41 18 * * 0' }]   # 매주 월 03:41 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: vendors, cancel-in-progress: false }
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pillow
      - run: python3 .github/scripts/fetch_mallthumbs.py
      - name: build & push if changed
        run: |
          [ -z "$(git status --porcelain src/assets/mall)" ] && { echo "no change"; exit 0; }
          git config user.name "wwood-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/assets/mall && git commit -qm "쇼핑몰 상품 작은 사진(webp) 추가"
          git pull -q --rebase -X theirs
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll && test -f googlebdb67d0a828cfb44.html && test -f naverba93ea476932b627cd632929e26465dd.html
          git add -A && git commit -qm "쇼핑몰 상품 작은 사진 반영 빌드" || true
          git pull --rebase -X theirs && git push
