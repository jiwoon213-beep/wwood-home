name: 방문자 공간 사진 올리기(얼굴·번호판 자동 모자이크)
on:
  schedule: [{ cron: '7,37 * * * *' }]   # 30분마다
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: wwup, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q 'opencv-python-headless==4.10.0.84' pillow numpy && sudo apt-get install -y -q fonts-nanum fonts-noto-cjk >/dev/null
      - run: curl -sL -o /tmp/yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
      - name: pull
        env: { WWUP_KEY: '${{ secrets.WWUP_KEY }}' }
        run: python3 .github/scripts/wwup_pull.py
      - name: commit (검토 대기 목록 — 자재 표시는 Claude 예약 작업이 사진을 보고 직접 달아서 공개)
        run: |
          git config user.name "wwood-build-bot"; git config user.email "actions@users.noreply.github.com"
          git add src/data/gonggan_pending.json src/assets/gonggan/v-*.jpg 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "방문자 공간 사진 받음(얼굴·번호판 자동 모자이크, 자재 표시 대기)" && git pull --rebase -X theirs && git push
