name: 방문자 공간 사진 올리기(얼굴·번호판 자동 모자이크)
on:
  schedule: [{ cron: '7,37 * * * *' }]   # 30분마다
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: wwup, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q opencv-python-headless pillow numpy && sudo apt-get install -y -q fonts-nanum fonts-noto-cjk >/dev/null
      - run: curl -sL -o /tmp/yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
      - name: pull
        env: { WWUP_KEY: '${{ secrets.WWUP_KEY }}' }
        run: python3 .github/scripts/wwup_pull.py
      - name: build & commit (새 사진 있을 때만)
        run: |
          git diff --quiet -- src/data/gonggan_visitor.json && exit 0
          cd src && python3 build.py https://www.wwood.co.kr && cp -r out/. .. && rm -rf out && cd ..
          test -f CNAME && test -f .nojekyll
          git config user.name "wwood-build-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "방문자 공간 사진 추가(얼굴·번호판 자동 모자이크)" && git pull --rebase -X theirs && git push
